name: Build Installers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    env:
      # 本机打包产物不需要代码签名(签名需要付费开发者证书),
      # 显式关闭自动发现证书,避免构建卡在找签名证书上
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      # macOS 深度校验(与 Gatekeeper 首次打开下载的 app 时同款检查):
      # 包内任何代码(含 extraResources 的 pngquant)签名不完整都会让用户看到
      # 「App 已损坏」打不开 —— 校验不过就让构建失败,不许发坏包。
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -maxdepth 3 -name '*.app' | head -1)
          echo "APP=$APP"
          codesign --verify --deep --strict "$APP"
          echo '== 深度校验通过 =='
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          spctl --assess --type execute "$APP" 2>&1 || echo '(spctl 拒绝 = 未公证,预期行为,用户端按 README 指引打开即可)'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
