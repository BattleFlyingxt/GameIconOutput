name: Release

# 打标签(v1.0.0 / v1.1.0 …)时自动构建两平台安装包,并发布到 GitHub Releases
# 标签由「Bump Version」工作流或本地 `git tag` 产生

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    env:
      # 未签名,关闭自动发现签名证书,避免构建卡在找证书上
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      # macOS 深度校验(与 Gatekeeper 首次打开下载的 app 时同款检查):
      # 包内任何代码(含 extraResources 的 pngquant)签名不完整都会让用户看到
      # 「App 已损坏」打不开 —— 校验不过就让构建失败,不许发坏包。
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -maxdepth 3 -name '*.app' | head -1)
          echo "APP=$APP"
          codesign --verify --deep --strict "$APP"
          echo '== 深度校验通过 =='
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier' || true
          spctl --assess --type execute "$APP" 2>&1 || echo '(spctl 拒绝 = 未公证,预期行为,用户端按 README 指引打开即可)'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: installers-windows-latest
          path: release/windows

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: installers-macos-latest
          path: release/macos

      - name: Create Release
        uses: softprops/action-gh-release@v2.6.2
        with:
          name: 游戏图标导出 ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          files: |
            release/windows/**
            release/macos/**
          # 并行上传 asset 时有竞态会导致 update-a-release-asset 404,串行上传规避
          preserve_order: true
          generate_release_notes: true
